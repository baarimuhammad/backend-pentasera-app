<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beli Tiket | Pentasara</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="stylesheet" href="style.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Cinzel', 'serif'],
                    },
                    colors: {
                        gold: '#C8922A',
                        'gold-light': '#E5B96A',
                        rust: '#B84C2B',
                        'rust-deep': '#8B2E12',
                        cream: '#F5EDE0',
                        dark: '#1A0F0A',
                        ink: '#2C1A0E',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cream/20 text-ink font-sans antialiased min-h-screen flex flex-col">

    <!-- Announcement Bar -->
    <div class="announcement">
        Buat event cuma 3 langkah. <a href="#">Buat Event sekarang</a>
    </div>

    <!-- Navbar -->
    <nav class="main-nav sticky top-0 z-50">
        <a href="index.html" class="logo flex items-center gap-2">
            <img src="assets/logo pentasera.png" alt="Pentasara Logo" class="logo-img">
            <span class="logo-text">PENTASARA</span>
        </a>
        <div class="search-bar">
            <input type="text" placeholder="Cari nama event....">
            <button class="search-btn">
                <i data-lucide="search" class="w-4 h-4"></i>
            </button>
        </div>
        <ul class="nav-links hidden lg:flex">
            <li><a href="tentang-kami.html">About Us</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="hubungi-kami.html">Contact</a></li>
        </ul>
        <div class="nav-btns">
            <!-- Logged Out View -->
            <div class="logged-out-only flex gap-3">
                <button class="btn-daftar" onclick="location.href='auth.html?tab=signup'">Daftar</button>
                <button class="btn-masuk" onclick="location.href='auth.html'">Masuk</button>
            </div>

            <!-- Logged In View -->
            <div class="logged-in-only flex items-center gap-4">
                <!-- User Mode Button -->
                <button class="btn-ticket user-only" onclick="location.href='auth.html?from=tiket'">
                    <i data-lucide="ticket" class="w-4 h-4"></i> Tiket Saya
                </button>
                <!-- Creator Mode Button -->
                <button class="btn-ticket creator-only" onclick="location.href='create-event.html'">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i> Buat Event
                </button>

                <!-- Profile Dropdown -->
                <div class="profile-container">
                    <div class="profile-img-wrap">
                        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&h=100&fit=crop" alt="User Profile">
                    </div>
                    <div class="dropdown-menu">
                        <div class="dropdown-header" onclick="toggleRole()">
                            <div class="switch-icon">
                                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                            </div>
                            <div class="dropdown-header-text">
                                <div class="dropdown-header-title">Beralih ke akun</div>
                                <div class="dropdown-header-role" id="dropdown-role-label">Penyelenggara</div>
                            </div>
                            <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
                        </div>
                        <div class="dropdown-list">
                            <!-- Creator Only Items -->
                            <a href="dashboard.html" class="dropdown-item creator-only">
                                <i data-lucide="layout-dashboard"></i> Dashboard
                            </a>
                            <a href="my-events.html" class="dropdown-item creator-only">
                                <i data-lucide="calendar"></i> Event Saya
                            </a>
                            <a href="manage-access.html" class="dropdown-item creator-only">
                                <i data-lucide="users"></i> Kelola Akses
                            </a>
                            
                            <!-- Common Items -->
                            <a href="profile.html" class="dropdown-item">
                                <i data-lucide="user"></i> Informasi Dasar
                            </a>
                            <a href="settings.html" class="dropdown-item">
                                <i data-lucide="settings"></i> Pengaturan
                            </a>
                            <a href="#" onclick="logout(); return false;" class="dropdown-item logout">
                                <i data-lucide="log-out"></i> Keluar
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="app" class="flex-1 max-w-7xl mx-auto w-full px-6 py-8 animate-fade-in">
        <div class="flex flex-col lg:flex-row gap-8" id="order-content">
            <!-- Content will be loaded by JS based on ID -->
            <div class="flex-1 py-20 text-center">Memuat data event...</div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="script.js" type="module"></script>
    <script>
        const ALL_EVENTS = [
            { id: 1, name: "Witness the Fire of Uluwatu", date: "03 Apr 2026", time: "18:00 WIB", venue: "Pura Luhur Uluwatu, Bali", price: "Rp150.000", image: "assets/kecak.png", organizer: "Uluwatu Cultural Foundation", description: "Pertunjukan tari Kecak yang legendaris di atas tebing Uluwatu dengan latar belakang matahari terbenam yang memukau." },
            { id: 2, name: "Stories Carved in Tradition", date: "08 Apr 2026", time: "20:00 WIB", venue: "Keraton Yogyakarta", price: "Rp50.000", image: "assets/wayang.png", organizer: "Keraton Heritage", description: "Pagelaran wayang kulit klasik yang membawakan kisah epik Ramayana oleh dalang ternama." },
            { id: 3, name: "Feel the Rhythm of Minangkabau", date: "11 Apr 2026", time: "16:00 WIB", venue: "Padang Cultural Center", price: "Rp80.000", image: "assets/taripiring.png", organizer: "Minang Arts", description: "Pertunjukan tari tradisional dari Sumatera Barat yang menampilkan ketangkasan para penari dalam memainkan piring." },
            { id: 4, name: "Harmony of Javanese Heritage", date: "12 Apr 2026", time: "19:00 WIB", venue: "Jatim Expo Surabaya", price: "Rp100.000", image: "assets/gamelan.png", organizer: "Gamelan Society", description: "Alunan musik gamelan Jawa yang menenangkan dan megah, dibawakan oleh ansambel musik tradisional lengkap." },
            { id: 5, name: "Experience the Magic of Bali", date: "15 Apr 2026", time: "17:30 WIB", venue: "GWK Cultural Park, Bali", price: "Rp125.000", image: "assets/TariBarong.png", organizer: "GWK Management", description: "Pertunjukan tari Barong yang melambangkan pertempuran antara kebajikan dan kejahatan dalam mitologi Bali." },
            { id: 6, name: "Rhythm in Perfect Harmony", date: "20 Apr 2026", time: "19:30 WIB", venue: "Istora Senayan, Jakarta", price: "Rp200.000", image: "assets/tarisaman.png", organizer: "Aceh Arts Council", description: "Tari Saman yang dinamis dan penuh semangat, menampilkan kekompakan gerakan tangan dan tubuh yang luar biasa." },
            { id: 7, name: "Grace in Every Movement", date: "25 Apr 2026", time: "16:00 WIB", venue: "Saung Angklung Udjo, Bandung", price: "Rp75.000", image: "assets/jaipong.png", organizer: "Sunda Heritage", description: "Tarian rakyat Jawa Barat yang enerjik dan ceria, diiringi oleh musik degung dan kendang yang khas." },
            { id: 8, name: "The Spirit of Batak Heritage", date: "30 Apr 2026", time: "10:00 WIB", venue: "Danau Toba, Sumatera Utara", price: "Rp50.000", image: "assets/tortor.png", organizer: "Toba Tourism", description: "Tarian sakral suku Batak yang dilakukan sebagai bentuk syukur dan penghormatan kepada leluhur di tepi Danau Toba." },
            { id: 9, name: "Elegance of the Royal Court", date: "05 Mei 2026", time: "19:00 WIB", venue: "Puri Saren Agung, Ubud", price: "Rp120.000", image: "assets/legong.png", organizer: "Ubud Royal Palace", description: "Tarian klasik Bali yang sangat halus dan ekspresif, dibawakan oleh penari-penari muda berbakat dengan kostum yang megah." },
            { id: 10, name: "Stories Carved in Tradition II", date: "10 Mei 2026", time: "20:00 WIB", venue: "Gedung Kesenian Jakarta", price: "Rp90.000", image: "assets/wayanggolek.png", organizer: "Sunda Arts Foundation", description: "Pertunjukan wayang golek khas Jawa Barat yang jenaka namun sarat pesan moral, dibawakan oleh dalang kondang." },
        ];

        const TICKETS = [
            { id: 't1', type: 'REGULAR', price: 'Rp80.000', status: 'Available', description: 'Tiket masuk standar untuk satu orang.' },
            { id: 't2', type: 'VIP', price: 'Rp150.000', status: 'Available', description: 'Akses baris depan, merchandise, dan snack box.' },
            { id: 't3', type: 'VVIP', price: 'Rp250.000', status: 'Available', description: 'Meet & Greet, baris terdepan, merchandise premium, dan lounge.' },
            { id: 't4', type: 'EARLY BIRD', price: 'Rp60.000', status: 'Limited', description: 'Promo terbatas untuk pembelian awal.' },
        ];

        let quantities = {};
        let activeTab = 'tiket';

        function setTab(tab) {
            activeTab = tab;
            render();
        }

        function render() {
            const params = new URLSearchParams(window.location.search);
            const id = parseInt(params.get('id')) || 1;
            const event = ALL_EVENTS.find(e => e.id === id) || ALL_EVENTS[0];
            
            const selectedTickets = TICKETS.filter(t => (quantities[t.id] || 0) > 0);
            
            const subtotal = TICKETS.reduce((sum, t) => {
                const q = quantities[t.id] || 0;
                const p = parseInt(t.price.replace(/[^0-9]/g, ''), 10);
                return sum + (q * p);
            }, 0);

            const serviceFee = subtotal > 0 ? Math.round(subtotal * 0.1) : 0;
            const total = subtotal + serviceFee;

            const hasTickets = selectedTickets.length > 0;

            document.getElementById('order-content').innerHTML = `
                <div class="flex-1 space-y-8">
                    <div class="rounded-2xl overflow-hidden shadow-2xl relative h-[400px]">
                        <img src="${event.image}" alt="${event.name}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                        <div class="absolute bottom-8 left-8">
                            <h1 class="font-display font-bold text-3xl text-white drop-shadow-lg uppercase tracking-widest">${event.name}</h1>
                        </div>
                    </div>

                    <div class="bg-white rounded-xl shadow-md border border-gold/10 overflow-hidden">
                        <div class="flex border-b border-gold/10">
                            <button onclick="setTab('tiket')" class="flex-1 py-4 text-sm font-bold ${activeTab === 'tiket' ? 'text-rust border-b-2 border-rust bg-cream/30' : 'text-gray-400'}">Pilih Tiket</button>
                            <button onclick="setTab('deskripsi')" class="flex-1 py-4 text-sm font-bold ${activeTab === 'deskripsi' ? 'text-rust border-b-2 border-rust bg-cream/30' : 'text-gray-400'}">Deskripsi Event</button>
                        </div>
                        <div class="p-8 space-y-6">
                            ${activeTab === 'tiket' ? 
                                TICKETS.map(t => `
                                    <div class="ticket-item border border-gold/20 rounded-xl p-6 flex justify-between items-center transition-all">
                                        <div class="flex-1 pr-4">
                                            <div class="flex items-center gap-2 mb-1">
                                                <h4 class="font-bold text-ink">${t.type}</h4>
                                                ${t.status === 'Limited' ? '<span class="px-2 py-0.5 bg-orange-100 text-orange-600 text-[10px] font-bold rounded uppercase">Limited</span>' : ''}
                                            </div>
                                            <p class="text-xs text-gray-500 leading-relaxed">${t.description}</p>
                                        </div>
                                        <div class="flex flex-col items-end gap-3">
                                            <div class="font-bold text-rust-deep text-lg">${t.price}</div>
                                            ${t.status === 'Sold Out' ? '<span class="text-xs font-bold text-red-500">Sold Out</span>' : `
                                                <div class="flex items-center gap-1 bg-gray-100 rounded-lg p-1">
                                                    <button onclick="updateQty('${t.id}', -1)" class="qty-btn w-8 h-8 flex items-center justify-center rounded-md hover:bg-white hover:shadow-sm transition-all text-gray-600 font-bold">-</button>
                                                    <span class="w-10 text-center font-bold text-ink">${quantities[t.id] || 0}</span>
                                                    <button onclick="updateQty('${t.id}', 1)" class="qty-btn w-8 h-8 flex items-center justify-center rounded-md bg-rust text-white hover:bg-rust-deep shadow-sm transition-all font-bold">+</button>
                                                </div>
                                            `}
                                        </div>
                                    </div>
                                `).join('')
                                : 
                                `
                                <div class="space-y-4">
                                    <h3 class="font-display font-bold text-xl text-ink">Tentang Event</h3>
                                    <p class="text-gray-600 leading-relaxed">${event.description}</p>
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4">
                                        <div class="bg-cream/20 p-4 rounded-lg border border-gold/10">
                                            <span class="text-[10px] font-bold text-gold uppercase tracking-widest block mb-1">Penyelenggara</span>
                                            <span class="text-sm font-bold text-ink">${event.organizer}</span>
                                        </div>
                                        <div class="bg-cream/20 p-4 rounded-lg border border-gold/10">
                                            <span class="text-[10px] font-bold text-gold uppercase tracking-widest block mb-1">Waktu</span>
                                            <span class="text-sm font-bold text-ink">${event.time}</span>
                                        </div>
                                    </div>
                                </div>
                                `
                            }
                        </div>
                    </div>
                </div>

                <aside class="w-full lg:w-80 space-y-6">
                    <div class="bg-white rounded-xl shadow-md p-6 border border-gold/10 space-y-4">
                        <h3 class="font-bold border-b pb-2 text-sm uppercase tracking-wider text-gold">Ringkasan Pesanan</h3>
                        ${hasTickets ? `
                            <div class="space-y-3 py-2">
                                ${selectedTickets.map(t => `
                                    <div class="flex justify-between text-xs">
                                        <span class="text-gray-600">${quantities[t.id]}x ${t.type}</span>
                                        <span class="font-medium">Rp ${(quantities[t.id] * parseInt(t.price.replace(/[^0-9]/g, ''), 10)).toLocaleString('id-ID')}</span>
                                    </div>
                                `).join('')}
                                <div class="flex justify-between text-xs pt-2 border-t border-dashed">
                                    <span class="text-gray-500 italic">Biaya Layanan (10%)</span>
                                    <span class="font-medium">Rp ${serviceFee.toLocaleString('id-ID')}</span>
                                </div>
                            </div>
                            <div class="border-t pt-3 flex justify-between items-center">
                                <span class="text-sm font-bold">Total Bayar</span>
                                <span class="font-black text-rust-deep text-lg">Rp ${total.toLocaleString('id-ID')}</span>
                            </div>
                        ` : `
                            <div class="py-4 text-center">
                                <p class="text-xs text-gray-400 italic">Belum ada tiket dipilih</p>
                            </div>
                        `}
                        
                        <button onclick="checkout()" class="w-full py-3 rounded-xl font-bold text-sm transition-all ${hasTickets ? 'bg-rust text-white hover:bg-rust-deep shadow-lg shadow-rust/20' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}" ${!hasTickets ? 'disabled' : ''}>
                            Lanjut Pembayaran
                        </button>
                    </div>

                    <div class="bg-white rounded-xl shadow-md p-6 border border-gold/10 space-y-4">
                        <h3 class="font-bold border-b pb-2 text-sm uppercase tracking-wider text-gold">Informasi Event</h3>
                        <div class="space-y-3">
                            <div class="flex gap-3 items-start">
                                <i data-lucide="calendar" class="w-4 h-4 text-rust mt-0.5"></i>
                                <div>
                                    <p class="text-[10px] text-gray-400 uppercase font-bold">Tanggal</p>
                                    <p class="text-xs font-medium">${event.date}</p>
                                </div>
                            </div>
                            <div class="flex gap-3 items-start">
                                <i data-lucide="clock" class="w-4 h-4 text-rust mt-0.5"></i>
                                <div>
                                    <p class="text-[10px] text-gray-400 uppercase font-bold">Waktu</p>
                                    <p class="text-xs font-medium">${event.time}</p>
                                </div>
                            </div>
                            <div class="flex gap-3 items-start">
                                <i data-lucide="map-pin" class="w-4 h-4 text-rust mt-0.5"></i>
                                <div>
                                    <p class="text-[10px] text-gray-400 uppercase font-bold">Lokasi</p>
                                    <p class="text-xs font-medium">${event.venue}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </aside>
            `;
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        window.updateQty = (tid, delta) => {
            quantities[tid] = Math.max(0, (quantities[tid] || 0) + delta);
            render();
        };

        window.checkout = () => {
            const params = new URLSearchParams(window.location.search);
            const eventId = params.get('id') || '1';
            const ticketData = Object.entries(quantities)
                .filter(([_, q]) => q > 0)
                .map(([tid, q]) => `${tid}:${q}`)
                .join(',');
            
            location.href = `checkout.html?id=${eventId}&tickets=${ticketData}`;
        };

        window.onload = render;
    </script>
</body>
</html>
